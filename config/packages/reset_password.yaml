symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Validade do link de "Esqueci minha senha" (segundos).
    # O e-mail de boas-vindas do app:tenant:import usa um prazo maior (PasswordResetMailer::WELCOME_LINK_LIFETIME).
    lifetime: 3600
    # Intervalo mínimo entre dois pedidos de link para o mesmo usuário (segundos).
    throttle_limit: 900
    enable_garbage_collection: true
