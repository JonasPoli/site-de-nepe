# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    # FormatExtensionResolver: injeta a URL estática com a extensão final direto no HTML,
    # em vez do /media/cache/resolve/..., que responde 302 antes de servir a imagem.
    cache: format_extension
    twig:
        mode: lazy
    webp:
        generate: true
        # Sem isto o .webp sai em qualidade 100 — maior que o JPEG que ele deveria substituir
        quality: 80
    filter_sets:
        cache: ~
        news_thumb:
            quality: 75
            filters:
                thumbnail: { size: [400, 220], mode: outbound }
        product_list:
            quality: 100
            filters:
                thumbnail: { size: [400, 500], mode: inset }
        admin_thumb:
            quality: 90
            filters:
                thumbnail:
                    size: [200, 200]
                    mode: inset
        # Capas de materiais/estudos: os originais são fotos em tamanho cheio (chegam a 8 MB).
        # format jpeg porque PNG de foto pesa dezenas de vezes mais; o fundo branco cobre
        # os PNGs com transparência, que ficariam pretos na conversão. O .webp sai junto.
        study_thumb:
            quality: 78
            format: jpeg
            filters:
                thumbnail: { size: [480, 270], mode: outbound }
                background: { size: [480, 270], color: '#ffffff' }
        study_featured:
            quality: 82
            format: jpeg
            filters:
                thumbnail: { size: [960, 540], mode: outbound }
                background: { size: [960, 540], color: '#ffffff' }
        # Logos do tenant: sem format jpeg — são PNGs com transparência, que ficariam
        # com caixa branca sobre o header escuro e no footer invertido
        logo_header:
            quality: 90
            filters:
                thumbnail: { size: [240, 120], mode: inset }   # header 52px / footer 48px de altura, com folga para telas retina
        logo_favicon:
            quality: 90
            filters:
                thumbnail: { size: [64, 64], mode: inset }
        study_cover:
            quality: 82
            format: jpeg
            filters:
                thumbnail: { size: [1280, 720], mode: outbound }
                background: { size: [1280, 720], color: '#ffffff' }

        # ── Imagens das páginas públicas (ajuste de PageSpeed, 17/11/2026) ──────────
        # Largura = o dobro da maior largura de exibição, para telas de densidade 2x.
        # O banner do topo é o maior elemento visível da página (LCP): duas larguras,
        # escolhidas pelo srcset, e o celular não baixa a de computador.
        hero_desktop:
            quality: 72
            format: webp
            filters:
                thumbnail: { size: [1600, 900], mode: outbound }
        hero_mobile:
            quality: 68
            format: webp
            filters:
                thumbnail: { size: [768, 560], mode: outbound }

        # Imagem dentro de bloco de conteúdo
        bloco_imagem:
            quality: 78
            format: webp
            filters:
                thumbnail: { size: [1000, 800], mode: inset }

        # Galeria do artigo: miniatura na grade (o clique abre o arquivo original)
        galeria:
            quality: 76
            format: webp
            filters:
                thumbnail: { size: [800, 450], mode: outbound }

        # "Quem somos" e outras imagens largas de conteúdo
        conteudo_largo:
            quality: 78
            format: webp
            filters:
                thumbnail: { size: [1200, 960], mode: inset }

        # Capa de página nos cartões de listagem
        capa_pagina:
            quality: 78
            format: webp
            filters:
                thumbnail: { size: [720, 480], mode: outbound }

        # Avatar de depoimento
        avatar:
            quality: 80
            format: webp
            filters:
                thumbnail: { size: [96, 96], mode: outbound }
